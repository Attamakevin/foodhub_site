<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.png">
<title>The Foodhub by CWC | No.1 Firewood Jollof Restaurant, Lekki</title>
<style>
:root{--bg:#fff;--sf:#fff;--ink:#111;--mu:#5f5f5f;--em:#e3120b;--emd:#b50d08;--ch:#0d0d0d;--ln:#e6e6e6;--cr:#f5f5f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-family:Georgia,serif;line-height:1.15;margin:0 0 .5em}h1{font-size:clamp(2.1rem,6vw,3.6rem)}h2{font-size:clamp(1.5rem,4vw,2.1rem)}
a{color:inherit;text-decoration:none}.w{max-width:1040px;margin:0 auto;padding:0 20px}section{padding:56px 0}.c{text-align:center}
.btn{display:inline-block;background:var(--em);color:#fff;padding:11px 24px;border-radius:999px;font-weight:600;border:0;cursor:pointer;font-size:1rem}
.btn:hover{background:var(--emd)}.btn.o{background:none;border:1px solid var(--em);color:var(--em)}.btn[disabled]{opacity:.5;cursor:not-allowed}
header{position:sticky;top:0;z-index:20;background:var(--ch);color:#ffffff}
header .w{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-weight:700}.logo img{border-radius:50%;flex:none}.logo span{color:#fff}.logo span span{color:#ff5a52}
.hr{display:flex;align-items:center;gap:20px}nav{display:flex;gap:20px;align-items:center}nav a{opacity:.85}nav a:hover,nav a.on{opacity:1}
.bg{display:none;width:42px;height:42px;background:none;border:0;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:0}.bg i{display:block;width:22px;height:2px;background:#fff;border-radius:2px;transition:transform .2s,opacity .2s}.bg.open i:nth-child(1){transform:translateY(7px) rotate(45deg)}.bg.open i:nth-child(2){opacity:0}.bg.open i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.cb{background:var(--em);border-radius:999px;padding:6px 14px;opacity:1!important}
@media(max-width:720px){.hr{gap:8px}.bg{display:flex}nav{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:var(--ch);padding:4px 20px 14px;border-top:1px solid #2a2a2a;box-shadow:0 14px 24px rgba(0,0,0,.35)}nav.open{display:flex}nav a{padding:14px 0;border-bottom:1px solid #2a2a2a;font-size:1.05rem;opacity:1}nav a:last-child{border-bottom:0}}
.hero{background:var(--ch);color:#ffffff;padding:56px 0 70px}.hero p{color:#dcdcdc;max-width:50ch;margin:0 0 22px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:22px}.card p{color:var(--mu);margin:0}
.alt{background:var(--cr)}.mu{color:var(--mu)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--em);color:#fff;border-color:var(--em)}
.it{display:flex;flex-direction:column;gap:8px}.it b{font-size:1.05rem}.pr{color:var(--em);font-weight:700;font-size:1.1rem}
select,input,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:inherit}
label{display:block;font-size:.9rem;margin:12px 0 4px;color:var(--mu)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--ln)}
.q{display:flex;align-items:center;gap:10px}.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700;padding-top:14px}
.pay{background:var(--ch);color:#ffffff;border-radius:16px;padding:22px;margin:18px 0}.pay .no{font-size:1.9rem;letter-spacing:.08em;font-weight:700;color:#ff5a52}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:28px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.ph{border-radius:16px;background:linear-gradient(145deg,#e3120b,#7d0a06 60%,#111);min-height:220px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-size:.85rem}
.ar{border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--sf)}.ar .f{display:grid;grid-template-columns:2fr 1fr;gap:8px}
img.im,.im{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}.ph.im{min-height:0;align-items:center;justify-content:center;text-align:center;font-weight:600;padding:10px}
.th{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--cr)}
.hg{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center}.hl{width:230px;height:230px;border-radius:50%}
.promo{background:var(--em);color:#fff;padding:22px 0}.promo .w{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.promo b{font-size:1.15rem}.promo .btn{background:#fff;color:var(--em)}
.tile{cursor:pointer;text-align:center;font-weight:600;font-family:Georgia,serif;font-size:1.05rem;color:var(--ink)}.tile:hover{border-color:var(--em)}
@media(max-width:720px){.hg{grid-template-columns:1fr}.hl{width:120px;height:120px;order:-1}}@media(max-width:520px){.lt{display:none}}
.sw{position:relative;display:inline-block;width:46px;height:26px;margin:0;flex:none}.sw input{opacity:0;width:0;height:0;padding:0;border:0;position:absolute}.sw span{position:absolute;inset:0;background:#bdbdbd;border-radius:26px;transition:.2s;cursor:pointer}.sw span:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+span{background:var(--em)}.sw input:checked+span:before{transform:translateX(20px)}
.rh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.rt{flex:1;min-width:150px;display:flex;flex-direction:column;line-height:1.35}.st{font-size:.85rem;color:var(--mu);min-width:62px}.sm{padding:6px 16px;font-size:.9rem}.eb{border-top:1px solid var(--ln);margin-top:12px;padding-top:6px}.arow.off{background:#fafafa}.arow.off .rt{opacity:.55}
.bar{position:sticky;top:64px;z-index:15;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--ln);margin-bottom:6px}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.tg.lead{grid-template-columns:repeat(auto-fit,minmax(260px,340px));justify-content:center}
small.bd{background:var(--em);color:#fff;border-radius:999px;padding:2px 10px;align-self:flex-start;font-weight:600;font-size:.8rem}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ch);color:#fff;padding:10px 18px;border-radius:999px;display:none;z-index:50;max-width:90%}
footer{background:#0a0a0a;color:#cfcfcf;padding:36px 0 22px;font-size:.92rem;margin-top:0}footer h4{color:#ffffff;margin:0 0 6px;font-family:Georgia,serif}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
var D=null,E=null,KEY=(function(){try{return sessionStorage.getItem('fh_key')||''}catch(e){return ''}})(),cat='All',cart=[];
var CATS=['Main Meals','Bowls','Promotional Offers','Proteins','Sides','Pastries','Celebration Cakes','Drinks','Fresh Juices','Ice Creams'],MAIN='Main Meals',PROMO='Promotional Offers',at='menu',af='All',sub='All',ed=null,TG=['Leadership','Management Team','The Wider Team'];
try{cart=JSON.parse(localStorage.getItem('fh_cart')||'[]')}catch(e){}
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function N(n){return '\u20A6'+Number(n).toLocaleString('en-NG')}
function sv(){try{localStorage.setItem('fh_cart',JSON.stringify(cart))}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},2600)}
function img(id,n){return id?'<img class="im" src="'+esc(id)+'" alt="'+esc(n)+'" loading="lazy">':'<div class="ph im">'+esc(n)+'</div>'}
function bnr(id){return 'background:'+(id?'linear-gradient(rgba(20,12,8,.62),rgba(20,12,8,.62)),url('+esc(id)+') center/cover':'linear-gradient(120deg,#0d0d0d,#8f0b07)')}
function tdy(){return D.today||new Date().toLocaleDateString('sv-SE',{timeZone:'Africa/Lagos'})}
function dact(r){var t=tdy();return !!r&&!!r.on&&+r.pct>0&&(!r.from||t>=r.from)&&(!r.to||t<=r.to)}
function dbest(i){var b=null;(D.discounts||[]).forEach(function(r){if(!dact(r))return;if(r.scope!=='all'&&(r.ids||[]).indexOf(i.id)<0)return;if(!b||+r.pct>+b.pct)b=r});return b}
function dpx(i,p){var r=dbest(i);return r?Math.round(p*(100-r.pct)/100):p}
function dbd(i){var r=dbest(i);return r?'<small class="bd">'+(r.name?esc(r.name)+': ':'')+esc(r.pct)+'% off</small>':''}
function pstr(i,p){var d=dpx(i,p);return d<p?N(d)+' (was '+N(p)+')':N(p)}
function dstrips(){return (D.discounts||[]).filter(dact).slice(0,2).map(function(r){var e=r.to?new Date(r.to+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';return '<div class="promo" style="background:#0d0d0d;border-bottom:3px solid var(--em)"><div class="w"><div><b>'+(r.name?esc(r.name)+': ':'')+esc(r.pct)+'% off '+(r.scope==='all'?'all products':'selected products')+'</b>'+(e?'<br><small>Offer ends '+esc(e)+'</small>':'')+'</div><button class="btn" onclick="go(\'All\')">Shop the Offer</button></div></div>'}).join('')}
function CO(s){var o=((s&&s.catOrder)||[]).filter(function(c){return CATS.indexOf(c)>-1}),r=[];o.forEach(function(c){if(r.indexOf(c)<0)r.push(c)});CATS.forEach(function(c){if(r.indexOf(c)<0)r.push(c)});return r}
function item(id){return D.items.filter(function(i){return i.id===id})[0]}
function lines(){return cart.map(function(l){if(l.id==='__p'){var pk=D.s.packs.filter(function(x){return x.n==l.n})[0];return pk?{l:l,i:{name:pk.n,img:''},o:{l:'Pack',p:pk.p},lb:'Pack',u:pk.p,t:pk.p*l.q,isPack:true}:null}
var i=item(l.id);if(!i||!i.on||!i.opts[l.o])return null;var o=i.opts[l.o];var u=dpx(i,o.p);return{l:l,i:i,o:o,lb:o.l,u:u,t:u*l.q}}).filter(Boolean)}
function total(){return lines().reduce(function(a,x){return a+x.t},0)}
function count(){return lines().reduce(function(a,x){return a+x.l.q},0)}
function needPk(){return D.s.packs.length>0&&lines().some(function(x){return !x.isPack&&[MAIN,'Proteins','Sides'].indexOf(x.i.cat)>-1})}
function packMissing(){return needPk()&&!lines().some(function(x){return x.isPack})}
function tryCo(){if(packMissing()){toast('Please add at least one pack for your meals.');var e=document.getElementById('pkb');if(e)e.scrollIntoView({behavior:'smooth',block:'center'});return}location.hash='#/checkout'}
function add(id){var s=$('#o'+id),o=s?+s.value:0,f=cart.filter(function(l){return l.id===id&&l.o===o})[0];if(f)f.q++;else cart.push({id:id,o:o,q:1});sv();toast('Added to your order');hdr()}
function pq(n){var f=cart.filter(function(l){return l.id==='__p'&&l.n==n})[0];return f?f.q:0}
function pkq(k,d){var n=D.s.packs[k].n,f=cart.filter(function(l){return l.id==='__p'&&l.n==n})[0];if(!f){if(d<0)return;f={id:'__p',n:n,q:0};cart.push(f)}f.q+=d;if(f.q<1)cart.splice(cart.indexOf(f),1);sv();var e=document.getElementById('pq'+k);if(e)e.textContent=pq(n);hdr();if(location.hash=='#/cart')route()}
function packbox(){if(!D.s.packs.length)return '';return '<div class="card" id="pkb" style="margin:0 0 18px;border-color:var(--em)"><b>Packs</b><p class="mu" style="margin:4px 0 8px">Every order with a main meal, protein or side needs at least one pack. Add as many as you need, for example one pack for two portions, or an extra pack for your protein.</p>'+D.s.packs.map(function(a,k){return '<div class="row" style="padding:8px 0"><span>'+esc(a.n)+' <small class="mu">'+N(a.p)+' each</small></span><span class="q"><button onclick="pkq('+k+',-1)">-</button><span id="pq'+k+'">'+pq(a.n)+'</span><button onclick="pkq('+k+',1)">+</button></span></div>'}).join('')+'</div>'}
function cartPacks(L){var need=L.some(function(x){return !x.isPack&&[MAIN,'Proteins','Sides'].indexOf(x.i.cat)>-1});if(!need||!D.s.packs.length)return '';return '<div style="margin-top:18px">'+(L.some(function(x){return x.isPack})?'':'<p style="color:var(--em)"><b>Packs required.</b> Please add at least one pack for your meals before you check out.</p>')+packbox()+'</div>'}
function qty(k,d){var L=lines()[k].l;L.q+=d;if(L.q<1)cart.splice(cart.indexOf(L),1);sv();route()}
function hdr(){var b=$('#cc');if(b)b.textContent='Order Now('+count()+')'}
function shell(h,p){var r=location.hash.slice(1)||'/',L=function(p,t,c){return '<a href="#'+p+'"'+(c?' class="'+c+'"':'')+(r==p||(p=='/story'&&r=='/team')?' style="opacity:1;border-bottom:2px solid var(--em)"':'')+'>'+t+'</a>'};
return '<header><div class="w"><a class="logo" href="#/"><img src="/logo.png" alt="The Foodhub by CWC logo" width="44" height="44"><span class="lt">The Foodhub <span>by CWC</span></span></a><div class="hr"><nav id="nav" onclick="cn()">'+L('/','Home')+L('/menu','Menu')+L('/story','Our Story')+L('/reviews','Social Proof')+'</nav><a class="cb" href="#/cart" id="cc">Order Now('+count()+')</a><button class="bg" id="bg" aria-label="Menu" aria-expanded="false" onclick="tg()"><i></i><i></i><i></i></button></div></div></header>'+h+
'<footer><div class="w"><div class="g3"><div><img src="/logo.png" alt="The Foodhub by CWC" width="64" height="64" style="border-radius:50%;margin-bottom:8px"><p>No.1 Firewood Jollof Restaurant, Lekki, Lagos.</p></div><div><h4>Visit Us</h4><p>'+esc(D.s.addr)+'<br>'+esc(D.s.hrs)+'</p></div><div><h4>Connect</h4><p><a href="https://www.instagram.com/foodhubbycwc" target="_blank" rel="noopener">Instagram</a><br><a href="https://wa.me/'+esc(D.s.wa)+'" target="_blank" rel="noopener">WhatsApp</a><br><a href="#/story">Our Story</a> &middot; <a href="#/team">Meet the Team</a> &middot; <a href="#/reviews">Reviews</a></p></div></div><p class="c" style="margin-top:24px;font-size:.85rem">&copy; 2026 The Foodhub by CWC. <a href="#/admin" style="opacity:.5">Staff</a></p></div></footer>'}
var pref='';
function ord(t){pref=t;cat='All';sub='All';location.hash='#/menu'}
function visit(){var e=document.getElementById('visit');if(e)e.scrollIntoView({behavior:'smooth'})}
function tg(){var n=$('#nav'),b=$('#bg'),o=n.classList.toggle('open');b.classList.toggle('open',o);b.setAttribute('aria-expanded',o)}
function cn(){var n=$('#nav'),b=$('#bg');if(n)n.classList.remove('open');if(b){b.classList.remove('open');b.setAttribute('aria-expanded','false')}}
document.addEventListener('keydown',function(e){if(e.key==='Escape')cn()});
document.addEventListener('click',function(e){if(!e.target.closest('header'))cn()});
function go(c){cat=c;sub='All';location.hash='#/menu'}
function rc(r){return '<div class="card it">'+(r.img?'<img class="im" style="aspect-ratio:auto;max-height:480px;object-fit:contain;background:var(--cr)" src="'+esc(r.img)+'" alt="Customer review" loading="lazy">':'')+(r.text?'<p style="margin:0">&ldquo;'+esc(r.text)+'&rdquo;</p>':'')+(r.name?'<b>'+esc(r.name)+'</b>':'')+'</div>'}
function home(){var pp=(D.s.popular||[]).map(function(id){return item(id)}).filter(function(i){return i&&i.on}),pop=pp.length?pp:D.items.filter(function(i){return i.on&&i.cat!=PROMO}).slice(0,3),R=(D.reviews||[]).filter(function(r){return r.on}).slice(0,3),cs=CATS.filter(function(c){return D.items.some(function(i){return i.cat==c&&i.on})});
return shell('<div class="hero" style="'+bnr(D.s.bh)+'"><div class="w hg"><div><h1>Good Food. Real Flavour. Made Like Home.</h1><p>From firewood jollof to rich soups, satisfying bowls and hearty local favourites, every meal brings the comfort of home and the flavour you crave. Order online, pick up your meal or come dine with us.</p><a class="btn" href="#/menu">Explore the Menu</a></div><img class="hl" src="/logo.png" alt="The Foodhub by CWC"></div></div>'+
dstrips()+(cs.indexOf(PROMO)>-1?'<div class="promo"><div class="w"><div><b>Promotional Offers</b><br>Group packages and office meals</div><button class="btn" onclick="go(PROMO)">See Offers</button></div></div>':'')+
'<section class="alt"><div class="w"><h2 class="c">Popular Orders</h2><div class="g3" style="margin-top:24px">'+pop.map(function(i){return '<div class="card it">'+img(i.img,i.name)+dbd(i)+'<b>'+esc(i.name)+'</b><span class="mu">'+esc(i.desc)+'</span><button class="btn o" onclick="go(\''+i.cat+'\')">Order</button></div>'}).join('')+'</div></div></section>'+
'<section><div class="w"><h2 class="c">Three Ways to Enjoy Us</h2><div class="g3" style="margin-top:24px"><div class="card it"><small class="mu">Delivery</small><h3>Your Cravings, Delivered.</h3><p>Your favourite TFH meals, delivered warm to your doorstep or office. You bring the appetite; we’ll take care of the food.</p><button class="btn o" style="margin-top:auto;align-self:flex-start" onclick="ord(\'Delivery\')">Order for Delivery</button></div><div class="card it"><small class="mu">Pickup</small><h3>Order Ahead. Pick Up. Dig In.</h3><p>Skip the wait and get straight to the good stuff. Place your order online and pick it up when it’s ready.</p><button class="btn o" style="margin-top:auto;align-self:flex-start" onclick="ord(\'Pickup\')">Order for Pickup</button></div><div class="card it"><small class="mu">Dine-in</small><h3>Good Food Tastes Better Together.</h3><p>Pull up a chair, gather your league and enjoy proper homestyle meals in a welcoming space. There’s always room for one more plate.</p><button class="btn o" style="margin-top:auto;align-self:flex-start" onclick="visit()">Come Dine With Us</button></div></div></div></section>'+
'<section class="alt"><div class="w"><h2 class="c">How to Order</h2><div class="g3" style="margin-top:24px"><div class="card"><h3>1. Build your order</h3><p>Add as many items as you like from the menu.</p></div><div class="card"><h3>2. Checkout</h3><p>Choose delivery, pickup or dine in.</p></div><div class="card"><h3>3. Pay online</h3><p>Pay securely by card, bank transfer or USSD through Paystack.</p></div><div class="card"><h3>4. Confirm on WhatsApp</h3><p>Your order details are sent to our team, and we send out your order.</p></div></div></div></section>'+
(R.length?'<section><div class="w"><h2 class="c">What Customers Say</h2><div class="g3" style="margin-top:24px">'+R.map(rc).join('')+'</div><p class="c" style="margin-top:20px"><a class="btn o" href="#/reviews">Read More Reviews</a></p></div></section>':'')+
'<section class="alt" id="visit"><div class="w"><h2 class="c">Visit Our Restaurant</h2><p class="c mu">We are open for walk-ins. Come hungry, sit down and enjoy home-style food.</p><p class="c"><b>'+esc(D.s.addr)+'</b><br>'+esc(D.s.hrs)+'</p></div></section>')}
function about(){var ps=String(D.s.story||'').split(/\n\s*\n/).filter(function(x){return x.trim()});
return shell('<div class="hero" style="padding:44px 0;'+bnr(D.s.bm)+'"><div class="w"><h1 style="font-size:2.2rem;margin:0 0 6px">Our Story</h1><p style="margin:0">The people and the fire behind the food.</p></div></div><div class="w" style="padding-top:22px">'+stab('/story')+'</div><section style="padding-top:20px"><div class="w two" style="align-items:center"><div>'+ps.map(function(p){return '<p style="font-size:1.05rem">'+esc(p)+'</p>'}).join('')+'<p><a class="btn" href="#/menu">View Our Menu</a> &nbsp; <a class="btn o" href="#/team">Meet the Team</a></p></div><div>'+(D.s.sp?'<img class="im" style="aspect-ratio:4/5" src="'+esc(D.s.sp)+'" alt="The Foodhub by CWC">':'<img src="/logo.png" alt="The Foodhub by CWC" style="width:100%;max-width:320px;margin:0 auto;display:block;border-radius:50%">')+'</div></div></section>')}
